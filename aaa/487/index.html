<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霸王龙劈火车</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1A1B26; /* 深夜暗黑背景 */
            overflow: hidden;
            font-family: "微软雅黑", sans-serif;
            touch-action: none;
            user-select: none;
        }
        #score-board {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #FFD700;
            z-index: 100;
        }
        /* 霸王龙和2P图标 */
        #dino-container {
            position: absolute;
            bottom: 50px;
            left: 50px;
            z-index: 10;
        }
        #dino { font-size: 70px; }
        #p2-badge {
            position: absolute;
            top: -25px;
            left: 10px;
            background-color: #FFD700;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            box-shadow: 0 0 15px #FFD700;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* 武器 */
        #weapon {
            position: absolute;
            bottom: 80px;
            left: 120px;
            font-size: 50px;
            opacity: 0;
            transform-origin: bottom left;
            z-index: 20;
        }
        .swing {
            animation: swingAnim 0.3s ease-out forwards;
        }
        @keyframes swingAnim {
            0% { opacity: 1; transform: rotate(0deg) translate(-20px, -20px); }
            50% { opacity: 1; transform: rotate(-90deg) translate(30px, -30px); }
            100% { opacity: 0; transform: rotate(-180deg) translate(-20px, -20px); }
        }

        /* 火车 */
        .train {
            position: absolute;
            bottom: 55px;
            right: -200px;
            font-size: 60px;
            z-index: 5;
        }

        /* 爆炸特效 */
        .boom {
            position: absolute;
            font-size: 80px;
            z-index: 30;
            animation: boomAnim 0.5s forwards;
        }
        @keyframes boomAnim {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        #tip {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="score-board">得分: 0 / 30</div>
    
    <div id="dino-container">
        <div id="p2-badge">2P</div>
        <div id="dino">🦖</div>
    </div>
    
    <div id="weapon">🗡️</div>

    <div id="tip">点击屏幕劈砍！看准火车靠近的时机！</div>

    <script>
        let score = 0;
        let totalTrains = 30;
        let spawnedTrains = 0;
        let isGameOver = false;
        
        const scoreBoard = document.getElementById('score-board');
        const weapon = document.getElementById('weapon');

        // 攻击逻辑
        function attack() {
            if (isGameOver) return;
            
            // 播放挥剑动画
            weapon.classList.remove('swing');
            void weapon.offsetWidth; // 触发重绘
            weapon.classList.add('swing');

            // 检测是否劈中火车
            const trains = document.querySelectorAll('.train');
            trains.forEach(train => {
                const rect = train.getBoundingClientRect();
                // 判定范围：当火车进入屏幕左侧 (x < 300) 且还没走出去 (x > -50) 时算命中
                if (rect.left < 300 && rect.right > 50) {
                    destroyTrain(train);
                }
            });
        }

        // 监听点击和键盘事件
        document.addEventListener('touchstart', attack, {passive: true});
        document.addEventListener('mousedown', attack);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') attack();
        });

        // 消灭火车
        function destroyTrain(trainElement) {
            if (trainElement.dataset.hit) return; // 防止重复击中
            trainElement.dataset.hit = "true";
            
            // 加分
            score++;
            scoreBoard.innerText = `得分: ${score} / 30`;

            // 获取位置
            const rect = trainElement.getBoundingClientRect();
            
            // 生成爆炸
            const boom = document.createElement('div');
            boom.className = 'boom';
            boom.innerText = '💥';
            boom.style.left = rect.left + 'px';
            boom.style.bottom = '40px';
            document.body.appendChild(boom);

            // 移除火车和爆炸
            trainElement.remove();
            setTimeout(() => boom.remove(), 500);
        }

        // 生成火车
        function spawnTrain() {
            if (spawnedTrains >= totalTrains) return;
            
            spawnedTrains++;
            const train = document.createElement('div');
            train.className = 'train';
            train.innerText = '🚂🚃🚃';
            document.body.appendChild(train);

            // 设置随机速度 (3s 到 5s 穿过屏幕)
            const duration = Math.random() * 2 + 3;
            train.style.transition = `right ${duration}s linear`;
            
            // 强制重绘后开始移动
            void train.offsetWidth;
            train.style.right = '100vw';

            // 火车穿过屏幕后的处理
            setTimeout(() => {
                if (train.parentNode && !train.dataset.hit) {
                    train.remove(); // 没劈中，直接移除
                }
            }, duration * 1000);
        }

        // 游戏主循环：每 1.2 秒生成一辆火车，直到生成完 30 辆
        const spawnInterval = setInterval(() => {
            if (spawnedTrains < totalTrains) {
                spawnTrain();
            } else {
                clearInterval(spawnInterval);
            }
        }, 1200);

        // 游戏结束结算
        setTimeout(() => {
            isGameOver = true;
            // 留点时间给最后一辆火车飞过去
            setTimeout(() => {
                if (score < 15) {
                    alert("霸王龙被火车撵走了。");
                } else if (score >= 15 && score < 30) {
                    alert("以后再来打通这个游戏吧。");
                } else if (score === 30) {
                    alert("你的世界很坚固。");
                }
            }, 5000);
        }, totalTrains * 1200 + 5000);

    </script>
</body>
</html>
