<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>冬至快乐</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #1a2a6c, #2a3b5c, #112240); /* 深邃冬夜 */
            font-family: "微软雅黑", sans-serif;
        }

        /* 初始弹窗遮罩 */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        /* 弹窗按钮 */
        #start-btn {
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            color: #ffb703;
            background-color: transparent;
            border: 3px solid #ffb703;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.4);
            transition: all 0.3s;
            animation: pulse 2s infinite;
        }
        #start-btn:hover {
            background-color: #ffb703;
            color: #112240;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* 冬至快乐文字 */
        #holiday-text {
            position: absolute;
            top: 40%;
            width: 100%;
            text-align: center;
            font-size: 60px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px #00d2ff, 0 0 40px #00d2ff, 0 0 60px #fff;
            opacity: 0;
            z-index: 50;
            pointer-events: none;
            letter-spacing: 10px;
        }

        /* 最终祝福语 */
        #final-greeting {
            position: absolute;
            top: 45%;
            width: 100%;
            text-align: center;
            font-size: 32px; /* 字稍微改大了一点点，更有冲击力 */
            font-weight: bold;
            color: #e0e1dd;
            opacity: 0;
            z-index: 50;
            pointer-events: none;
            transition: opacity 2s ease-in;
        }

        /* 雪花样式 */
        .snowflake {
            position: absolute;
            top: -10px;
            color: #fff;
            font-size: 1em;
            opacity: 0.8;
            pointer-events: none;
            z-index: 10;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(100vh); }
        }
    </style>
</head>
<body>

    <!-- 弹窗遮罩 -->
    <div id="overlay">
        <button id="start-btn">点这里！</button>
    </div>

    <!-- 冬至快乐文字 -->
    <div id="holiday-text">冬至快乐</div>

    <!-- 最终祝福语（已修改） -->
    <div id="final-greeting">
        祝你天天开心，你个臭乐乐
    </div>

    <script>
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const holidayText = document.getElementById('holiday-text');
        const finalGreeting = document.getElementById('final-greeting');

        // 制作雪花
        function createSnow() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❅'; // 雪花符号
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.fontSize = (Math.random() * 15 + 10) + 'px'; // 随机大小
            snowflake.style.animationDuration = (Math.random() * 3 + 3) + 's'; // 下落时间 3-6秒
            snowflake.style.opacity = Math.random() * 0.8 + 0.2;
            document.body.appendChild(snowflake);

            // 落地后移除，节省内存
            setTimeout(() => {
                snowflake.remove();
            }, 6000);
        }

        // 点击按钮触发动画
        startBtn.addEventListener('click', function() {
            // 1. 隐藏弹窗
            overlay.style.display = 'none';

            // 2. 显示“冬至快乐”（淡入）
            holidayText.style.transition = 'opacity 1s';
            holidayText.style.opacity = '1';

            // 3. 开始下雪（每50毫秒生成一片雪花）
            const snowInterval = setInterval(createSnow, 50);

            // 4. 两秒后“冬至快乐”消失
            setTimeout(() => {
                holidayText.style.opacity = '0';

                // 5. “冬至快乐”完全消失后，显示最终祝福语
                setTimeout(() => {
                    finalGreeting.style.opacity = '1';
                }, 1000);
                
                // 6. 雪下一阵子后，可以慢慢变少，这里设个10秒后停止生成新雪花
                setTimeout(() => {
                    clearInterval(snowInterval);
                }, 10000);

            }, 2500); // 停留 2.5 秒
        });
    </script>
</body>
</html>
