<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命定之人测试</title>
    <style>
        body {
            text-align: center;
            font-family: "微软雅黑";
            margin-top: 100px;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44); 
            color: white;
        }
        h2 { margin-bottom: 30px; color: #ffaa00; }
        
        /* 输入框样式 */
        input {
            width: 300px;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            outline: none;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
        }

        
        #result {
            display: none; 
            margin-top: 30px;
        }

        #result img {
            max-width: 80%;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.6); 
            animation: fadeIn 1s; 
        }

        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2>✦ 命运占卜仪式 ✦</h2>
    
    
    <input type="text" id="destinyInput" placeholder="输入心中所想并回车即可命定之人">
    
    
    <div id="result">
        < img src="https://github.com/kebaozuikeai/kebaozuikeai.github.io/blob/main/mingd.jpg" alt="命定之人">
    </div>

    <script>
    
        const input = document.getElementById('destinyInput');

        // 监听键盘按键事件
        input.addEventListener('keydown', function(event) {
            // 如果按下的键是“Enter”回车键
            if (event.key === 'Enter') {
                // 把图片区域显示出来
                document.getElementById('result').style.display = 'block';
                // 让输入框变淡或者隐藏，更有仪式感
                input.style.opacity = '0.3';
                input.value = "啊啊啊啊你居然喜欢胖子";
            }
        });
    </script>

</body>
</html>
