<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命定之人测试</title>
    <style>
        body {
            text-align: center;
            font-family: "微软雅黑";
            margin-top: 100px;
            background: linear-gradient(135deg, #1e1e2f, #2d2d44); 
            color: white;
        }
        h2 { margin-bottom: 30px; color: #ffaa00; }
        
        input {
            width: 300px;
            padding: 15px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            outline: none;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
        }

        #result {
            display: none; 
            margin-top: 30px;
        }

        #result img {
            max-width: 80%;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.6); 
            animation: fadeIn 1s; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <h2>✦ 命运占卜仪式 ✦</h2>
    
    <input type="text" id="destinyInput" placeholder="输入心中所想即可命定之人">
    
    <div id="result">
        <!-- 注意看这里！你只要把引号里的网址换成你在浏览器里验证过得能打开图片的网址就行！ -->
        <img src="https://kebaozuikeai.github.io/mingd.jpg">
    </div>

    <script>
        const input = document.getElementById('destinyInput');
        input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                document.getElementById('result').style.display = 'block';
                input.style.opacity = '0.3';
                input.value = "命运已经揭晓...";
            }
        });
    </script>

</body>
</html>
