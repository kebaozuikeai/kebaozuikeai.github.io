<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>绿色青蛙捏捏乐</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f8ff;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* 游戏区容器 */
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }

        /* 对话气泡 */
        #bubble {
            background-color: #fff;
            border: 3px solid #333;
            border-radius: 20px;
            padding: 15px 25px;
            position: absolute;
            top: -100px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.1);
            font-family: "微软雅黑", sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(10px);
            text-align: center;
            white-space: nowrap;
            z-index: 10;
        }
        
        #bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            margin-left: -10px;
            border-width: 10px;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
        
        #bubble::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            margin-left: -7px;
            border-width: 7px;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
            z-index: 2;
        }

        #bubble.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 青蛙本体 */
        #frog {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle at 30% 30%, #a8e6cf, #4caf50);
            border-radius: 50% 50% 45% 45%;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15), inset 0 -10px 20px rgba(0,0,0,0.1);
            -webkit-tap-highlight-color: transparent;
            z-index: 1;
        }

        /* 长按戳下去的效果 */
        #frog:active, #frog.squished {
            transform: scale(1.1, 0.8);
            box-shadow: 0 5px 10px rgba(0,0,0,0.2), inset 0 -5px 10px rgba(0,0,0,0.2);
        }

        /* 眼睛 */
        .eye {
            width: 45px;
            height: 45px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 25px;
            border: 3px solid #4caf50;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eye.left { left: 20px; }
        .eye.right { right: 20px; }

        /* 瞳孔 */
        .pupil {
            width: 20px;
            height: 20px;
            background-color: #222;
            border-radius: 50%;
            position: relative;
            transition: transform 0.2s;
        }

        /* 高光 */
        .pupil::after {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #fff;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
        }

        /* 嘴巴 */
        .mouth {
            width: 40px;
            height: 20px;
            border-bottom: 5px solid #2e7d32;
            border-radius: 0 0 40px 40px;
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* 腮红 */
        .blush {
            width: 20px;
            height: 10px;
            background-color: #ff8a80;
            border-radius: 50%;
            position: absolute;
            top: 85px;
            opacity: 0.7;
        }
        .blush.left { left: 15px; }
        .blush.right { right: 15px; }

        /* 提示文字 */
        .hint {
            margin-top: 40px;
            font-family: "微软雅黑", sans-serif;
            color: #888;
            font-size: 16px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 对话气泡 -->
        <div id="bubble"></div>
        
        <!-- 青蛙本体 -->
        <div id="frog">
            <div class="eye left"><div class="pupil"></div></div>
            <div class="eye right"><div class="pupil"></div></div>
            <div class="blush left"></div>
            <div class="blush right"></div>
            <div class="mouth"></div>
        </div>
    </div>

    <div class="hint">长按戳下去，松开弹回来~</div>

    <script>
        const frog = document.getElementById('frog');
        const bubble = document.getElementById('bubble');
        
        // 可爱的文案和颜文字库
        const texts = [
            "干嘛戳我呀！ (｡•́︿•̀｡)",
            "哼唧~ 不要捏啦！ (˶ᵔ ᵕ ᵔ˶)",
            "好疼！但是再来一下 (๑•́ ₃ •̀๑)",
            "呱！你干什么！ (╯°□°）╯",
            "呜呜呜，肚子要爆了 (இ﹏இ`｡)",
            "今天也要加油背单词哦 (ง •̀_•́)ง",
            "再捏我就生气了！ (｀へ´*)",
            "咕噜咕噜... (¯﹃¯)"
        ];

        let audioCtx = null;
        let bubbleTimeout = null;

        // 初始化音频环境 (需要用户交互才能触发)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 合成“哼唧”音效
        function playSqueak() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine'; // 正弦波，声音比较像卡通玩具

            // 频率快速变化，模拟“叽”的一声
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);

            // 音量包络：快速起音，迅速衰减
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        }

        // 显示气泡
        function showBubble() {
            const randomText = texts[Math.floor(Math.random() * texts.length)];
            bubble.innerText = randomText;
            
            // 重置气泡动画
            bubble.classList.remove('show');
            void bubble.offsetWidth; // 触发重绘
            bubble.classList.add('show');
            
            // 1.5秒后隐藏
            if (bubbleTimeout) clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                bubble.classList.remove('show');
            }, 1500);
        }

        // 按下时触发
        function startSquish(e) {
            e.preventDefault(); // 防止手机端长按选中文字
            frog.classList.add('squished');
            playSqueak();
            showBubble();
            
            // 移动端震动反馈 (如果设备支持)
            if (navigator.vibrate) navigator.vibrate(30);
        }

        // 松开时触发
        function endSquish() {
            frog.classList.remove('squished');
        }

        // 绑定鼠标事件
        frog.addEventListener('mousedown', startSquish);
        document.addEventListener('mouseup', endSquish);

        // 绑定触摸事件 (适配手机)
        frog.addEventListener('touchstart', startSquish, { passive: false });
        document.addEventListener('touchend', endSquish);
        document.addEventListener('touchcancel', endSquish);
    </script>

</body>
</html>
