<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>软萌小绿捏捏乐</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f7fa, #b2ebf2);
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            font-family: "微软雅黑", sans-serif;
        }

        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 对话气泡 */
        #bubble {
            background-color: #fff;
            border: 3px solid #2e7d32;
            border-radius: 20px;
            padding: 15px 25px;
            position: absolute;
            top: -110px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            font-size: 18px;
            font-weight: bold;
            color: #333;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            transform: translateY(15px);
            text-align: center;
            white-space: nowrap;
            z-index: 10;
        }
        
        #bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            margin-left: -10px;
            border-width: 10px;
            border-style: solid;
            border-color: #2e7d32 transparent transparent transparent;
        }
        
        #bubble::before {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            margin-left: -7px;
            border-width: 7px;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
            z-index: 2;
        }

        #bubble.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 捏捏乐主体（用SVG绘制可爱青蛙） */
        #frog {
            width: 220px;
            height: 220px;
            cursor: pointer;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            -webkit-tap-highlight-color: transparent;
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.15));
        }

        /* 按下去的效果（压扁、拉宽） */
        #frog:active, #frog.squished {
            transform: scale(1.15, 0.75);
        }

        .hint {
            margin-top: 50px;
            color: #00796b;
            font-size: 16px;
            font-weight: bold;
            animation: pulse 2s infinite;
            background: rgba(255,255,255,0.6);
            padding: 8px 16px;
            border-radius: 20px;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="bubble"></div>
        
        <!-- 胖乎乎的SVG青蛙 -->
        <svg id="frog" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 身体渐变色，让它更立体 -->
                <radialGradient id="bodyGrad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#a5d6a7" />
                    <stop offset="100%" stop-color="#4caf50" />
                </radialGradient>
                <radialGradient id="eyeGrad" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#81c784" />
                    <stop offset="100%" stop-color="#388e3c" />
                </radialGradient>
            </defs>

            <!-- 身体 -->
            <ellipse cx="100" cy="120" rx="75" ry="65" fill="url(#bodyGrad)" />
            
            <!-- 眼睛底座 -->
            <circle cx="55" cy="60" r="32" fill="url(#eyeGrad)" />
            <circle cx="145" cy="60" r="32" fill="url(#eyeGrad)" />
            
            <!-- 眼白 -->
            <circle cx="55" cy="60" r="22" fill="#ffffff" />
            <circle cx="145" cy="60" r="22" fill="#ffffff" />
            
            <!-- 瞳孔 -->
            <circle cx="55" cy="65" r="10" fill="#2c3e50" />
            <circle cx="145" cy="65" r="10" fill="#2c3e50" />
            
            <!-- 瞳孔高光（灵魂） -->
            <circle cx="51" cy="61" r="4" fill="#ffffff" />
            <circle cx="141" cy="61" r="4" fill="#ffffff" />
            
            <!-- 小腮红 -->
            <ellipse cx="35" cy="115" rx="12" ry="8" fill="#ff8a80" opacity="0.6" />
            <ellipse cx="165" cy="115" rx="12" ry="8" fill="#ff8a80" opacity="0.6" />
            
            <!-- 可爱的小嘴巴 (W型) -->
            <path d="M 80 125 Q 90 140 100 125 Q 110 140 120 125" stroke="#2e7d32" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>

    <div class="hint">长按戳下去，松开弹回来~</div>

    <script>
        const frog = document.getElementById('frog');
        const bubble = document.getElementById('bubble');
        
        const texts = [
            "干嘛戳我呀！ (｡•́︿•̀｡)",
            "哼唧~ 不要捏啦！ (˶ᵔ ᵕ ᵔ˶)",
            "好疼！但是再来一下 (๑•́ ₃ •̀๑)",
            "呱！你干什么！ (╯°□°）╯",
            "呜呜呜，肚子要爆了 (இ﹏இ`｡)",
            "今天也要加油背单词哦 (ง •̀_•́)ง",
            "再捏我就生气了！ (｀へ´*)",
            "咕噜咕噜... (¯﹃¯)"
        ];

        let audioCtx = null;
        let bubbleTimeout = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSqueak() {
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.type = 'sine'; 
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(450, now);
            osc.frequency.exponentialRampToValueAtTime(1100, now + 0.1);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.2);

            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.25);
        }

        function showBubble() {
            const randomText = texts[Math.floor(Math.random() * texts.length)];
            bubble.innerText = randomText;
            
            bubble.classList.remove('show');
            void bubble.offsetWidth; 
            bubble.classList.add('show');
            
            if (bubbleTimeout) clearTimeout(bubbleTimeout);
            bubbleTimeout = setTimeout(() => {
                bubble.classList.remove('show');
            }, 1500);
        }

        function startSquish(e) {
            e.preventDefault(); 
            frog.classList.add('squished');
            playSqueak();
            showBubble();
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function endSquish() {
            frog.classList.remove('squished');
        }

        frog.addEventListener('mousedown', startSquish);
        document.addEventListener('mouseup', endSquish);

        frog.addEventListener('touchstart', startSquish, { passive: false });
        document.addEventListener('touchend', endSquish);
        document.addEventListener('touchcancel', endSquish);
    </script>

</body>
</html>
