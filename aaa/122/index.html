<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓住点点！</title>
    <style>
        body { background-color: #2d2d44; color: white; text-align: center; margin-top: 20%; font-family: "微软雅黑"; }
        h1 { color: #ffaa00; }
        #btn { position: fixed; width: 150px; cursor: pointer; border-radius: 20px; }
    </style>
</head>
<body>
    <h1>你能抓到这只点点吗？</h1>
    <img id="btn" src="https://kebaozuikeai.github.io/aaa/122/ddd.jpg" alt="点点">
    <script>
        const btn = document.getElementById('btn');
        let count = 0;
        function runAway() {
            count++;
            if (count >= 3) {
                alert("点点要去吃饭了！");
                btn.style.display = 'none';
                return;
            }
            let x = Math.random() * (window.innerWidth - 200);
            let y = Math.random() * (window.innerHeight - 200);
            btn.style.left = x + "px";
            btn.style.top = y + "px";
        }
        btn.addEventListener('mouseover', runAway);
        btn.addEventListener('click', runAway);
    </script>
</body>
</html>
